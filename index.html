<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮点格式可视化转换器 | FP64~FP4 全格式支持</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        body { 
            background: #f8fafc; 
            color: #0f172a; 
            padding: 32px 20px; 
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        h1 { 
            font-size: 28px; 
            font-weight: 600; 
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: #64748b; 
            margin-bottom: 28px; 
            font-size: 14px; 
        }

        .control-bar {
            background: #fff; 
            border-radius: 12px; 
            padding: 18px 24px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.08); 
            margin-bottom: 24px;
            display: flex; 
            gap: 28px; 
            flex-wrap: wrap; 
            align-items: flex-end;
        }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { 
            font-size: 12px; 
            color: #475569; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        select, input[type="number"], input[type="text"] {
            padding: 8px 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px;
            font-size: 14px; 
            background: #fff; 
            min-width: 200px;
            transition: all 0.15s ease;
        }
        select:focus, input:focus { 
            outline: none; 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12); 
        }

        .custom-params {
            display: none; 
            gap: 16px; 
            flex-wrap: wrap;
            width: 100%;
            padding-top: 16px; 
            margin-top: 12px; 
            border-top: 1px solid #e2e8f0;
        }
        .custom-params.active { display: flex; }
        .custom-params .control-group input { width: 100px; min-width: auto; }
        .control-group.checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .main-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 24px; 
            margin-bottom: 24px;
        }
        .panel {
            background: #fff; 
            border-radius: 12px; 
            padding: 24px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.08);
        }
        .panel h2 { 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .field { margin-bottom: 20px; }
        .field label { 
            display: block; 
            font-size: 12px; 
            color: #475569; 
            margin-bottom: 8px; 
            font-weight: 500;
        }
        .field input { 
            width: 100%; 
            font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; 
            font-size: 14px; 
        }

        .bits-display {
            margin: 16px 0; 
            padding: 14px; 
            background: #f8fafc; 
            border-radius: 8px;
            font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; 
            font-size: 13px; 
            letter-spacing: 0;
            display: flex; 
            flex-wrap: wrap; 
            gap: 3px; 
            user-select: none;
        }
        .bit {
            width: 20px; 
            height: 24px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.15s ease; 
            font-weight: 500;
            font-size: 12px;
        }
        .bit:hover { transform: scale(1.15); }
        .bit.sign { background: #fee2e2; color: #b91c1c; }
        .bit.exp { background: #dbeafe; color: #1d4ed8; }
        .bit.mant { background: #dcfce7; color: #15803d; }

        .hex-display {
            font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; 
            font-size: 16px; 
            padding: 10px 14px;
            background: #f0fdf4; 
            border-radius: 8px; 
            display: inline-block;
            color: #166534;
            width: 100%;
            word-break: break-all;
        }

        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 12px; 
            color: #64748b; 
            margin-top: 8px; 
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

        .details-section {
            background: #fff; 
            border-radius: 12px; 
            padding: 24px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.08); 
            margin-bottom: 24px;
        }
        .details-section h2 {
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 16px;
            color: #1e293b;
        }
        .details-grid {
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-top: 12px;
        }
        .detail-card {
            background: #f8fafc; 
            padding: 14px; 
            border-radius: 8px; 
            text-align: center;
        }
        .detail-card .label { 
            font-size: 11px; 
            color: #64748b; 
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .detail-card .value { 
            font-size: 16px; 
            font-weight: 600; 
            font-family: "JetBrains Mono", monospace; 
        }

        .formula {
            margin-top: 20px; 
            padding: 16px; 
            background: #eff6ff; 
            border-radius: 8px;
            font-family: "Times New Roman", serif; 
            font-size: 17px; 
            text-align: center;
            color: #1e40af;
        }

        .mx-section {
            margin-top: 16px; 
            padding: 14px; 
            background: #fef3c7; 
            border-radius: 8px;
            font-size: 13px; 
            color: #92400e; 
            display: none;
        }
        .mx-section.active { display: block; }

        @media (max-width: 960px) {
            .main-grid { grid-template-columns: 1fr; }
            .details-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 浮点格式可视化转换器</h1>
        <p class="subtitle">支持 FP64 / FP32 / TF32 / BF16 / FP16 / FP8 / MXFP4 全系列 · 纯前端离线计算</p>

        <div class="control-bar">
            <div class="control-group">
                <label>浮点格式</label>
                <select id="formatSelect">
                    <option value="fp64">FP64 (IEEE 754 Double)</option>
                    <option value="fp32">FP32 (IEEE 754 Float)</option>
                    <option value="tf32">TF32 (TensorFloat-32, NVIDIA)</option>
                    <option value="bf16">BF16 (BFloat16)</option>
                    <option value="fp16">FP16 (IEEE 754 Half)</option>
                    <option value="e4m3fn">FP8 E4M3FN (NVIDIA)</option>
                    <option value="e4m3fnuz">FP8 E4M3FNUZ (AMD)</option>
                    <option value="e5m2">FP8 E5M2</option>
                    <option value="e8m0fnu">FP8 E8M0FNU (MX缩放因子)</option>
                    <option value="mxfp4">MXFP4 (E2M1, OCP)</option>
                    <option value="custom">自定义格式</option>
                </select>
            </div>

            <div class="control-group">
                <label>舍入模式</label>
                <select id="roundingSelect">
                    <option value="round_even">就近舍入，偶优先 (IEEE 默认)</option>
                    <option value="trunc">向零截断</option>
                    <option value="ceil">向正无穷舍入</option>
                    <option value="floor">向负无穷舍入</option>
                </select>
            </div>

            <div class="control-group">
                <label>MX 块缩放</label>
                <select id="mxScaleToggle">
                    <option value="off">关闭</option>
                    <option value="on">启用 E8M0 缩放因子</option>
                </select>
            </div>

            <div class="custom-params" id="customParams">
                <div class="control-group">
                    <label>符号位</label>
                    <input type="number" id="signBits" value="1" min="0" max="1">
                </div>
                <div class="control-group">
                    <label>指数位</label>
                    <input type="number" id="expBits" value="5" min="0" max="15">
                </div>
                <div class="control-group">
                    <label>尾数位</label>
                    <input type="number" id="mantBits" value="10" min="0" max="64">
                </div>
                <div class="control-group">
                    <label>指数偏移 Bias</label>
                    <input type="number" id="biasVal" value="15" min="0">
                </div>
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="hasInf" checked>
                    <label for="hasInf" style="margin: 0;">支持 Inf</label>
                </div>
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="hasNaN" checked>
                    <label for="hasNaN" style="margin: 0;">支持 NaN</label>
                </div>
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="hasDenorm" checked>
                    <label for="hasDenorm" style="margin: 0;">支持次正规数</label>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2>输入值</h2>
                <div class="field">
                    <label>十进制数值 (Decimal Input)</label>
                    <input type="number" id="decimalInput" value="0.5" step="any">
                </div>
                <div class="field">
                    <label>二进制位模式 · 点击翻转</label>
                    <div class="bits-display" id="bitsDisplay"></div>
                </div>
                <div class="field">
                    <label>十六进制表示 (Hex)</label>
                    <input type="text" id="hexInput" value="3F000000" style="font-family: monospace; text-transform: uppercase;">
                </div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot" style="background:#fee2e2"></span>符号位</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#dbeafe"></span>指数位</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#dcfce7"></span>尾数位</div>
                </div>
            </div>

            <div class="panel">
                <h2>存储结果</h2>
                <div class="field">
                    <label>实际存储值 (Value Stored)</label>
                    <div class="hex-display" id="storedValue">0.5</div>
                </div>
                <div class="field">
                    <label>二进制位模式</label>
                    <div class="bits-display" id="bitsDisplayOut" style="cursor: default;"></div>
                </div>
                <div class="field">
                    <label>十六进制值</label>
                    <div class="hex-display" id="hexOutput">0x3F000000</div>
                </div>
                <div class="mx-section" id="mxSection">
                    <strong>MX 缩放因子 (E8M0):</strong>
                    <span id="mxScaleVal">1.0</span>
                    <span id="mxScaleHex" style="font-family: monospace; margin-left: 8px;">(0x7F)</span>
                    <br>
                    最终值 = 元素值 × 缩放因子 = <strong id="mxFinalVal">0.5</strong>
                </div>
            </div>
        </div>

        <div class="details-section">
            <h2>字段详细分解</h2>
            <div class="details-grid">
                <div class="detail-card">
                    <div class="label">符号位 Sign</div>
                    <div class="value" id="detailSign">0</div>
                </div>
                <div class="detail-card">
                    <div class="label">偏置指数 Biased Exp</div>
                    <div class="value" id="detailRawExp">126</div>
                </div>
                <div class="detail-card">
                    <div class="label">实际指数 Actual Exp</div>
                    <div class="value" id="detailExp">-1</div>
                </div>
                <div class="detail-card">
                    <div class="label">数值类型</div>
                    <div class="value" id="detailType" style="font-size: 13px;">正规数</div>
                </div>
            </div>
            <div class="details-grid" style="grid-template-columns: repeat(3, 1fr); margin-top: 12px;">
                <div class="detail-card">
                    <div class="label">原始尾数整数</div>
                    <div class="value" id="detailRawMant">0</div>
                </div>
                <div class="detail-card">
                    <div class="label">尾数实际值</div>
                    <div class="value" id="detailMantVal">1.000000</div>
                </div>
                <div class="detail-card">
                    <div class="label">指数偏移 Bias</div>
                    <div class="value" id="detailBias">127</div>
                </div>
            </div>
            <div class="formula" id="formula">
                (-1)⁰ × 1.0 × 2⁻¹ = 0.5
            </div>
        </div>
    </div>

    <script>
        // ===================== 格式预设（严格对齐官方规范）=====================
        const FORMAT_PRESETS = {
            fp64: {
                sign_bits: 1, exp_bits: 11, mant_bits: 52,
                bias: 1023, has_inf: true, has_nan: true, has_denorm: true,
                name: "FP64 Double"
            },
            fp32: {
                sign_bits: 1, exp_bits: 8, mant_bits: 23,
                bias: 127, has_inf: true, has_nan: true, has_denorm: true,
                name: "FP32 Float"
            },
            tf32: {
                sign_bits: 1, exp_bits: 8, mant_bits: 10,
                bias: 127, has_inf: true, has_nan: true, has_denorm: true,
                name: "TF32 TensorFloat"
            },
            bf16: {
                sign_bits: 1, exp_bits: 8, mant_bits: 7,
                bias: 127, has_inf: true, has_nan: true, has_denorm: true,
                name: "BF16 BFloat16"
            },
            fp16: {
                sign_bits: 1, exp_bits: 5, mant_bits: 10,
                bias: 15, has_inf: true, has_nan: true, has_denorm: true,
                name: "FP16 Half"
            },
            e4m3fn: {
                sign_bits: 1, exp_bits: 4, mant_bits: 3,
                bias: 7, has_inf: false, has_nan: true, has_denorm: true,
                name: "FP8 E4M3FN"
            },
            e4m3fnuz: {
                sign_bits: 1, exp_bits: 4, mant_bits: 3,
                bias: 8, has_inf: false, has_nan: false, has_denorm: true,
                name: "FP8 E4M3FNUZ"
            },
            e5m2: {
                sign_bits: 1, exp_bits: 5, mant_bits: 2,
                bias: 15, has_inf: true, has_nan: true, has_denorm: true,
                name: "FP8 E5M2"
            },
            e8m0fnu: {
                sign_bits: 0, exp_bits: 8, mant_bits: 0,
                bias: 127, has_inf: false, has_nan: false, has_denorm: false,
                name: "FP8 E8M0FNU"
            },
            mxfp4: {
                sign_bits: 1, exp_bits: 2, mant_bits: 1,
                bias: 1, has_inf: false, has_nan: false, has_denorm: true,
                name: "MXFP4 E2M1"
            }
        };

        let currentFormat = { ...FORMAT_PRESETS.fp32 };
        let currentRaw = 0x3F000000n; // 使用 BigInt 支持 64 位
        let isUpdating = false;

        // ===================== 核心编解码（BigInt 版本，支持任意位宽）=====================
        function encodeFloat(value, fmt, rounding = 'round_even') {
            const { sign_bits, exp_bits, mant_bits, bias, has_inf, has_nan, has_denorm } = fmt;
            const totalBits = sign_bits + exp_bits + mant_bits;
            if (totalBits === 0) return { raw: 0n, stored: 0 };

            const BIAS = BigInt(bias);
            const MAX_RAW_EXP = (1n << BigInt(exp_bits)) - 1n;
            const isFullExpSpecial = has_inf || has_nan;
            const maxNormalRawExp = isFullExpSpecial ? MAX_RAW_EXP - 1n : MAX_RAW_EXP;
            const maxExp = Number(maxNormalRawExp - BIAS);
            const minNormalExp = has_denorm ? 1 - bias : 0 - bias;

            let sign = 0;
            let absVal = Math.abs(value);
            if (sign_bits === 1) {
                sign = value < 0 ? 1 : 0;
                absVal = Math.abs(value);
            }

            // 零值
            if (absVal === 0) {
                if (!has_denorm) {
                    const raw = BigInt(sign) << BigInt(exp_bits + mant_bits);
                    const decoded = decodeFloat(raw, fmt);
                    return { raw, stored: sign ? -decoded.stored : decoded.stored };
                }
                const raw = BigInt(sign) << BigInt(exp_bits + mant_bits);
                return { raw, stored: sign ? -0 : 0 };
            }

            // NaN
            if (isNaN(value)) {
                if (!has_nan) {
                    const maxMant = (1n << BigInt(mant_bits)) - 1n;
                    const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (maxNormalRawExp << BigInt(mant_bits)) | maxMant;
                    const decoded = decodeFloat(raw, fmt);
                    return { raw, stored: sign ? -decoded.stored : decoded.stored };
                }
                const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (MAX_RAW_EXP << BigInt(mant_bits)) | 1n;
                return { raw, stored: NaN };
            }

            // 无穷大
            if (!isFinite(absVal)) {
                if (!has_inf) {
                    const maxMant = (1n << BigInt(mant_bits)) - 1n;
                    const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (maxNormalRawExp << BigInt(mant_bits)) | maxMant;
                    const decoded = decodeFloat(raw, fmt);
                    return { raw, stored: sign ? -decoded.stored : decoded.stored };
                }
                const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (MAX_RAW_EXP << BigInt(mant_bits));
                return { raw, stored: sign ? -Infinity : Infinity };
            }

            // 计算指数和尾数
            let exp = Math.floor(Math.log2(absVal));
            let mant = absVal / (2 ** exp);

            if (mant >= 2) { mant /= 2; exp += 1; }

            // 上溢饱和
            if (exp > maxExp) {
                const maxMant = (1n << BigInt(mant_bits)) - 1n;
                const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (maxNormalRawExp << BigInt(mant_bits)) | maxMant;
                const decoded = decodeFloat(raw, fmt);
                return { raw, stored: sign ? -decoded.stored : decoded.stored };
            }

            let rawExp, mantFrac;

            // 下溢处理
            if (exp < minNormalExp) {
                if (!has_denorm) {
                    const raw = BigInt(sign) << BigInt(exp_bits + mant_bits);
                    const decoded = decodeFloat(raw, fmt);
                    return { raw, stored: sign ? -decoded.stored : decoded.stored };
                }
                const shift = minNormalExp - exp;
                mant = mant / (2 ** shift);
                rawExp = 0n;
                mantFrac = mant;
            } else {
                rawExp = BigInt(exp + bias);
                mantFrac = mant - 1;
            }

            const mantScaled = mantFrac * (1 << mant_bits);
            let rawMant;

            // 舍入
            switch (rounding) {
                case 'round_even':
                    rawMant = Math.round(mantScaled);
                    if (Math.abs(mantScaled - Math.floor(mantScaled)) === 0.5) {
                        rawMant = Math.floor(mantScaled) % 2 === 0 ? Math.floor(mantScaled) : Math.ceil(mantScaled);
                    }
                    break;
                case 'trunc': rawMant = Math.trunc(mantScaled); break;
                case 'ceil': rawMant = Math.ceil(mantScaled); break;
                case 'floor': rawMant = Math.floor(mantScaled); break;
                default: rawMant = Math.round(mantScaled);
            }

            rawMant = BigInt(rawMant);

            // 尾数进位溢出
            if (mant_bits > 0 && rawMant >= (1n << BigInt(mant_bits))) {
                rawMant = 0n;
                rawExp += 1n;
                if (rawExp > maxNormalRawExp) {
                    if (has_inf) {
                        const raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (MAX_RAW_EXP << BigInt(mant_bits));
                        return { raw, stored: sign ? -Infinity : Infinity };
                    } else {
                        rawExp = maxNormalRawExp;
                        rawMant = (1n << BigInt(mant_bits)) - 1n;
                    }
                }
            }

            rawMant &= (1n << BigInt(mant_bits)) - 1n;
            rawExp &= MAX_RAW_EXP;

            let raw = (BigInt(sign) << BigInt(exp_bits + mant_bits)) | (rawExp << BigInt(mant_bits)) | rawMant;
            raw &= (1n << BigInt(totalBits)) - 1n;

            const decoded = decodeFloat(raw, fmt);
            return { raw, stored: decoded.stored };
        }

        function decodeFloat(raw, fmt) {
            const { sign_bits, exp_bits, mant_bits, bias, has_inf, has_nan, has_denorm } = fmt;
            const totalBits = sign_bits + exp_bits + mant_bits;
            raw = BigInt(raw) & ((1n << BigInt(totalBits)) - 1n);

            const mantMask = mant_bits > 0 ? (1n << BigInt(mant_bits)) - 1n : 0n;
            const expMask = exp_bits > 0 ? (1n << BigInt(exp_bits)) - 1n : 0n;

            const rawMant = raw & mantMask;
            const rawExp = mant_bits > 0 ? (raw >> BigInt(mant_bits)) & expMask : raw & expMask;
            const sign = sign_bits === 1 ? Number((raw >> BigInt(exp_bits + mant_bits)) & 1n) : 0;

            let type = "正规数", mantVal, actualExp;

            // 指数全1：特殊值
            if (exp_bits > 0 && rawExp === expMask) {
                if (has_inf) {
                    if (rawMant === 0n) {
                        type = "无穷大 (Inf)";
                        return { stored: sign ? -Infinity : Infinity, sign, rawExp: Number(rawExp), rawMant: Number(rawMant), type, actualExp: Infinity, mantVal: Infinity };
                    } else if (has_nan) {
                        type = "非数值 (NaN)";
                        return { stored: NaN, sign, rawExp: Number(rawExp), rawMant: Number(rawMant), type, actualExp: NaN, mantVal: NaN };
                    }
                } else if (has_nan) {
                    type = "非数值 (NaN)";
                    return { stored: NaN, sign, rawExp: Number(rawExp), rawMant: Number(rawMant), type, actualExp: NaN, mantVal: NaN };
                }
                mantVal = mant_bits > 0 ? 1 + Number(rawMant) / (1 << mant_bits) : 1;
                actualExp = Number(rawExp) - bias;
            }
            // 指数全0：次正规/零
            else if (exp_bits > 0 && rawExp === 0n) {
                if (!has_denorm) {
                    type = "正规数";
                    mantVal = 1;
                    actualExp = 0 - bias;
                } else {
                    if (rawMant === 0n) { type = "零"; mantVal = 0; }
                    else { type = "次正规数"; mantVal = Number(rawMant) / (1 << mant_bits); }
                    actualExp = 1 - bias;
                }
            }
            // 正规数
            else {
                mantVal = mant_bits > 0 ? 1 + Number(rawMant) / (1 << mant_bits) : 1;
                actualExp = exp_bits > 0 ? Number(rawExp) - bias : 0;
            }

            let value = mantVal * (2 ** actualExp);
            if (sign) value = -value;

            return { 
                stored: value, 
                sign, 
                rawExp: Number(rawExp), 
                rawMant: Number(rawMant), 
                type, 
                actualExp, 
                mantVal 
            };
        }

        // ===================== UI 逻辑 =====================
        function getCurrentFormat() {
            const selected = document.getElementById('formatSelect').value;
            if (selected === 'custom') {
                return {
                    sign_bits: parseInt(document.getElementById('signBits').value) || 0,
                    exp_bits: parseInt(document.getElementById('expBits').value) || 0,
                    mant_bits: parseInt(document.getElementById('mantBits').value) || 0,
                    bias: parseInt(document.getElementById('biasVal').value) || 0,
                    has_inf: document.getElementById('hasInf').checked,
                    has_nan: document.getElementById('hasNaN').checked,
                    has_denorm: document.getElementById('hasDenorm').checked
                };
            }
            return { ...FORMAT_PRESETS[selected] };
        }

        function renderBits(raw, fmt, container, clickable = false) {
            const { sign_bits, exp_bits, mant_bits } = fmt;
            const totalBits = sign_bits + exp_bits + mant_bits;
            const binStr = raw.toString(2).padStart(totalBits, '0');
            container.innerHTML = '';

            let index = 0;

            // 符号位
            for (let i = 0; i < sign_bits; i++) {
                const bitEl = document.createElement('span');
                bitEl.className = 'bit sign';
                bitEl.textContent = binStr[index];
                if (clickable) {
                    const pos = index;
                    bitEl.addEventListener('click', () => flipBit(pos));
                }
                container.appendChild(bitEl);
                index++;
            }

            // 指数位
            for (let i = 0; i < exp_bits; i++) {
                const bitEl = document.createElement('span');
                bitEl.className = 'bit exp';
                bitEl.textContent = binStr[index];
                if (clickable) {
                    const pos = index;
                    bitEl.addEventListener('click', () => flipBit(pos));
                }
                container.appendChild(bitEl);
                index++;
            }

            // 尾数位
            for (let i = 0; i < mant_bits; i++) {
                const bitEl = document.createElement('span');
                bitEl.className = 'bit mant';
                bitEl.textContent = binStr[index];
                if (clickable) {
                    const pos = index;
                    bitEl.addEventListener('click', () => flipBit(pos));
                }
                container.appendChild(bitEl);
                index++;
            }
        }

        function flipBit(pos) {
            const fmt = getCurrentFormat();
            const totalBits = fmt.sign_bits + fmt.exp_bits + fmt.mant_bits;
            const mask = 1n << BigInt(totalBits - 1 - pos);
            currentRaw ^= mask;
            currentRaw &= (1n << BigInt(totalBits)) - 1n;
            updateFromRaw();
        }

        function updateFromDecimal() {
            if (isUpdating) return;
            isUpdating = true;
            const fmt = getCurrentFormat();
            const value = parseFloat(document.getElementById('decimalInput').value);
            const rounding = document.getElementById('roundingSelect').value;
            const result = encodeFloat(value, fmt, rounding);
            currentRaw = result.raw;
            updateDisplays(result.stored, fmt, false);
            isUpdating = false;
        }

        function onDecimalBlur() {
            const fmt = getCurrentFormat();
            const value = parseFloat(document.getElementById('decimalInput').value) || 0;
            const rounding = document.getElementById('roundingSelect').value;
            const result = encodeFloat(value, fmt, rounding);
            document.getElementById('decimalInput').value = result.stored;
        }

        function updateFromHex() {
            if (isUpdating) return;
            isUpdating = true;
            const fmt = getCurrentFormat();
            const totalBits = fmt.sign_bits + fmt.exp_bits + fmt.mant_bits;
            let hex = document.getElementById('hexInput').value.replace(/^0x/i, '');
            let raw = hex ? BigInt('0x' + hex) : 0n;
            raw &= (1n << BigInt(totalBits)) - 1n;
            currentRaw = raw;
            const decoded = decodeFloat(raw, fmt);
            updateDisplays(decoded.stored, fmt, true);
            isUpdating = false;
        }

        function updateFromRaw() {
            if (isUpdating) return;
            isUpdating = true;
            const fmt = getCurrentFormat();
            const decoded = decodeFloat(currentRaw, fmt);
            updateDisplays(decoded.stored, fmt, true);
            isUpdating = false;
        }

        function updateDisplays(storedValue, fmt, updateDecimal = true) {
            const totalBits = fmt.sign_bits + fmt.exp_bits + fmt.mant_bits;
            const hexLen = Math.ceil(totalBits / 4);
            const hexStr = currentRaw.toString(16).toUpperCase().padStart(hexLen, '0');

            if (updateDecimal) {
                document.getElementById('decimalInput').value = storedValue;
            }
            document.getElementById('hexInput').value = hexStr;

            renderBits(currentRaw, fmt, document.getElementById('bitsDisplay'), true);
            renderBits(currentRaw, fmt, document.getElementById('bitsDisplayOut'), false);

            document.getElementById('storedValue').textContent = storedValue;
            document.getElementById('hexOutput').textContent = '0x' + hexStr;

            const decoded = decodeFloat(currentRaw, fmt);
            document.getElementById('detailSign').textContent = decoded.sign;
            document.getElementById('detailRawExp').textContent = decoded.rawExp;
            document.getElementById('detailExp').textContent = decoded.actualExp;
            document.getElementById('detailType').textContent = decoded.type;
            document.getElementById('detailRawMant').textContent = decoded.rawMant;
            document.getElementById('detailMantVal').textContent = decoded.mantVal.toFixed(6);
            document.getElementById('detailBias').textContent = fmt.bias;

            let formula = '';
            if (fmt.sign_bits) formula += `(-1)<sup>${decoded.sign}</sup> × `;
            formula += `${decoded.mantVal.toFixed(4)}`;
            if (fmt.exp_bits) formula += ` × 2<sup>${decoded.actualExp}</sup>`;
            formula += ` = ${storedValue}`;
            document.getElementById('formula').innerHTML = formula;

            updateMxScale(storedValue);
        }

        function updateMxScale(baseValue) {
            const mxEnabled = document.getElementById('mxScaleToggle').value === 'on';
            const mxSection = document.getElementById('mxSection');
            if (!mxEnabled) {
                mxSection.classList.remove('active');
                return;
            }
            mxSection.classList.add('active');
            const scaleRaw = 127;
            const scaleVal = 2 ** (scaleRaw - 127);
            const finalVal = baseValue * scaleVal;
            document.getElementById('mxScaleVal').textContent = scaleVal;
            document.getElementById('mxScaleHex').textContent = `(0x${scaleRaw.toString(16).toUpperCase().padStart(2,'0')})`;
            document.getElementById('mxFinalVal').textContent = finalVal.toFixed(6);
        }

        // ===================== 初始化 =====================
        function init() {
            document.getElementById('formatSelect').addEventListener('change', () => {
                const isCustom = document.getElementById('formatSelect').value === 'custom';
                document.getElementById('customParams').classList.toggle('active', isCustom);
                updateFromDecimal();
            });

            document.getElementById('roundingSelect').addEventListener('change', updateFromDecimal);
            document.getElementById('mxScaleToggle').addEventListener('change', () => updateFromRaw());

            document.getElementById('decimalInput').addEventListener('input', updateFromDecimal);
            document.getElementById('decimalInput').addEventListener('blur', onDecimalBlur);
            document.getElementById('hexInput').addEventListener('input', updateFromHex);

            ['signBits', 'expBits', 'mantBits', 'biasVal', 'hasInf', 'hasNaN', 'hasDenorm'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateFromDecimal);
                document.getElementById(id).addEventListener('change', updateFromDecimal);
            });

            updateFromDecimal();
        }

        init();
    </script>
</body>
</html>
